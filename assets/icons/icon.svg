<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#dbeafe"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- Fond arrondi -->
    <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)"/>

    <!-- Cercle décoratif subtil -->
    <circle cx="256" cy="256" r="200" fill="#ffffff" opacity="0.06"/>

    <!-- Texte "IN" -->
    <g filter="url(#shadow)">
        <text x="256" y="310"
              font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
              font-size="220"
              font-weight="900"
              fill="url(#textGrad)"
              text-anchor="middle"
              letter-spacing="-8">IN</text>
    </g>

    <!-- Petite barre sous le texte (signature ICEA) -->
    <rect x="166" y="352" width="180" height="10" rx="5" fill="#ffffff" opacity="0.85"/>
</svg>