<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#dbeafe"/>
        </linearGradient>
    </defs>

    <!-- Fond plein (pas arrondi, car le launcher gère la forme) -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Zone safe : 80% central (410x410 environ) -->
    <!-- Texte réduit pour rester dans la safe zone -->
    <text x="256" y="290"
          font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="160"
          font-weight="900"
          fill="url(#textGrad)"
          text-anchor="middle"
          letter-spacing="-6">IN</text>

    <!-- Barre sous le texte -->
    <rect x="196" y="318" width="120" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
</svg>